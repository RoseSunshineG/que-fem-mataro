 const t=iso(today()),loc=LOC[st.lang];
 const fD=new Intl.DateTimeFormat(loc,{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}),fL=new Intl.DateTimeFormat(loc,{day:"numeric",month:"short",timeZone:"UTC"});
 const up=E.filter(e=>(e.e||e.d)>=t).sort((x,y)=>((x.d<t?t:x.d)+x.h).localeCompare((y.d<t?t:y.d)+y.h));
 const [wa,wb]=range("weekend");
 const card=e=>{const d=e.d<t?`${S.until} ${fL.format(new Date((e.e||e.d)+"T00:00:00Z"))}`:fD.format(new Date(e.d+"T00:00:00Z"))+(e.h?` · ${esc(e.h)}`:"");
  const pr=e.p===0?`<span class="price free">${L.gratis}</span>`:e.p?`<span class="price">${esc(e.p)}</span>`:"";
  return `<button class="mini" data-go="${e.id}"><span class="md">${d}</span><h3>${esc(ttl(e))}</h3><span class="mv">${esc(e.v)}</span>${pr}</button>`;};
 const rows=[["weekend",up.filter(e=>(e.e||e.d)>=wa&&e.d<=wb)],["kids",up.filter(e=>e.k)],["free",up.filter(e=>e.p===0)],["wheel",up.filter(e=>e.acc&&e.acc.f.includes("wheel"))]];
 const fW=new Intl.DateTimeFormat(loc,{weekday:"short",timeZone:"UTC"});
 let h=rows.filter(r=>r[1].length).map(([k,list])=>`<section class="shelf"><div class="shead"><h2>${k==="wheel"?S.acc:S[k]}</h2><button class="seeall" data-preset="${k}">${S.all} →</button></div><div class="strip">${list.slice(0,12).map(card).join("")}</div></section>`).join("");
 h+=`<section class="shelf"><div class="shead"><h2>${S.week}</h2><button class="seeall" data-preset="week">${S.all} →</button></div><div class="strip">${WEEK.map(w=>`<button class="mini" data-preset="week"><span class="md">${fW.format(new Date(Date.UTC(2026,9,25+w.wd)))} · ${w.h}</span><h3>${esc(ttl(w))}</h3><span class="mv">${esc(w.v)}</span></button>`).join("")}</div></section>`;
 $("shelves").innerHTML=h+`<h2 class="agendaH">${S.agenda}</h2>`;
}
function renderWeek(XL,q){
 const fW=new Intl.DateTimeFormat(LOC[st.lang],{weekday:"long",timeZone:"UTC"});
 const w=WEEK.filter(e=>!(st.free||st.wheel)&&(!st.cat||e.c===st.cat)&&(!st.kids||e.k)&&(!st.barri||e.b===st.barri)&&matchesQ(e,q));
 if(!w.length){$("week").innerHTML="";return;}
 const days=[...new Set(w.map(e=>e.wd))].sort();
 $("week").innerHTML=`<h2>${XL.wkH}</h2><p>${XL.wkP}</p>`+days.map(d=>{const name=fW.format(new Date(Date.UTC(2026,9,25+d)));
  return `<div class="wd"><div class="wn">${name.slice(0,3)}</div><div class="list">`+w.filter(e=>e.wd===d).sort((a,b)=>a.h.localeCompare(b.h)).map(e=>
  `<article class="ev"><div class="meta"><span class="time">${e.h}</span><span class="cat">${CATS[e.c][st.lang]}</span>${e.k?`<span class="kid">${XL.kid}</span>`:""}</div><h3>${esc(ttl(e))}</h3><div class="meta"><span>${esc(e.v)}</span><span>·</span><span>${BARRIS[e.b]}</span></div><p>${esc(desc(e))}</p><div class="foot"><span class="price ask">${XL.wkI}</span><a class="src" href="${esc(e.u)}" target="_blank" rel="noopener">${T[st.lang].more} · ${XL.wkS} ↗</a></div></article>`).join("")+`</div></div>`;}).join("");
}
function sheet(o){document.body.classList.toggle("sheet",o);$("filtBtn").setAttribute("aria-expanded",o);if(o)$("sheetClose").focus();}
$("filtBtn").addEventListener("click",()=>sheet(true));
$("sheetClose").addEventListener("click",()=>sheet(false));
$("showBtn").addEventListener("click",()=>{sheet(false);$("count").scrollIntoView({block:"start"});});
$("backdrop").addEventListener("click",()=>sheet(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")sheet(false);});
$("clearBtn").addEventListener("click",()=>{Object.assign(st,{cat:null,free:false,kids:false,wheel:false,barri:"",q:""});$("q").value="";render();});
document.addEventListener("click",ev=>{const m=ev.target.closest("[data-go],[data-preset]");if(!m)return;
 if(m.dataset.go){const el=$("ev-"+m.dataset.go);if(el){el.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1600);}return;}
 const k=m.dataset.preset;if(k==="week"){$("week").scrollIntoView({block:"start"});return;}
 if(k==="weekend")st.when="weekend";else if(k==="kids")st.kids=true;else if(k==="free")st.free=true;else if(k==="wheel")st.wheel=true;
 render();$("count").scrollIntoView({block:"start"});ev.stopImmediatePropagation();},true);
let lastY=window.scrollY;
window.addEventListener("scroll",()=>{const y=window.scrollY;if(document.body.classList.contains("sheet"))return;
 if(y>lastY+6&&y>260)document.body.classList.add("hidebar");else if(y<lastY-6||y<120)document.body.classList.remove("hidebar");lastY=y;},{passive:true});
document.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
 if(b.dataset.l){st.lang=b.dataset.l;try{localStorage.setItem("qfm-lang",st.lang)}catch(e){}}
 else if(b.dataset.w)st.when=b.dataset.w;else if(b.id==="freeBtn")st.free=!st.free;else if(b.id==="kidsBtn")st.kids=!st.kids;else if(b.id==="wheelBtn")st.wheel=!st.wheel;else if("c" in b.dataset)st.cat=b.dataset.c||null;else return;render();});
$("barri").addEventListener("change",e=>{st.barri=e.target.value;render();});
$("q").addEventListener("input",e=>{st.q=e.target.value;render();});

render();
fetch("data/events.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{
 UPDATED=d.updated;
 E=(d.events||[]).map((e,i)=>({...e,id:i,acc:VENUE_ACC[e.v]||null}));
}).catch(err=>console.error("No s'ha pogut carregar l'agenda",err)).finally(()=>{LOADED=true;render();});
</script>
